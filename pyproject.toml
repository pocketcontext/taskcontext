[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "taskcontext-client"
version = "0.1.0"
description = "Portable taskcontext command-line client"
requires-python = ">=3.11"
dependencies = ["observecontext-client @ git+https://github.com/pocketcontext/observecontext.git@d10e84bb30ce607c03c62c03a4fdfd596d32ab27"]

[project.scripts]
taskcontext = "taskcontext_client.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/taskcontext_client"]
