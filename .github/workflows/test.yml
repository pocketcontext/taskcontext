name: issue tracker integration
on:
  push:
  pull_request:
  # image.yml calls this workflow before it publishes an image.
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: taskcontext
          persist-credentials: false
      - name: Install packaged CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/context-client"
          "$RUNNER_TEMP/context-client/bin/pip" install ./taskcontext
          echo "$RUNNER_TEMP/context-client/bin" >> "$GITHUB_PATH"
      - name: Test deployment orchestration
        run: python3 taskcontext/tests/deploy_workflow.py
      - name: Test packaged resources and launcher
        run: python3 taskcontext/tests/packaging.py
      - name: Read server revision
        id: server
        shell: bash
        run: |
          revision=$(cat taskcontext/POCKETCONTEXT_VERSION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pocketcontext/pocketcontext
          ref: ${{ steps.server.outputs.revision }}
          path: pocketcontext
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pocketcontext/go.mod
          cache-dependency-path: pocketcontext/go.sum
      - name: Test maintenance entrypoint
        run: python3 taskcontext/tests/maintenance_entrypoint.py
      - name: Build server
        working-directory: pocketcontext
        # The flags of pocketcontext's Makefile.
        run: CGO_ENABLED=1 go build -tags sqlite_math_functions -o bin/pocketcontext ./cmd/pocketcontext
      - name: Test maintenance freeze and frozen restart
        run: python3 taskcontext/tests/maintenance.py --binary pocketcontext/bin/pocketcontext
      - name: Test issue tracker
        run: python3 taskcontext/tests/integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test skill
        run: python3 taskcontext/tests/skill.py --binary pocketcontext/bin/pocketcontext
      - name: Test OAuth client
        run: python3 taskcontext/tests/oauth.py
      - name: Test OAuth exchange and identity
        run: python3 taskcontext/tests/oauth_integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test deployment hooks
        run: python3 taskcontext/tests/deploy.py --binary pocketcontext/bin/pocketcontext
      - name: Test required user provisioning
        run: python3 taskcontext/tests/required_users.py --binary pocketcontext/bin/pocketcontext
      - name: Test account access and revocation
        run: python3 taskcontext/tests/account_access.py --binary pocketcontext/bin/pocketcontext
      - name: Test realtime revocation
        run: python3 taskcontext/tests/realtime_access.py --binary pocketcontext/bin/pocketcontext
      - name: Test opt-in trace isolation
        run: python3 taskcontext/tests/tracing.py --binary pocketcontext/bin/pocketcontext
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build and test authenticated reader
        run: |
          npm install --global pnpm@10.33.2
          cd taskcontext/ui
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
          cd ../..
          python3 taskcontext/tests/reader.py --binary pocketcontext/bin/pocketcontext --browser
